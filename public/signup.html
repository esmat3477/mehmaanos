<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/icon.svg">
<title>Start free · MehmaanOS</title>
</head>
<body>
<header class="top"><div class="wrap narrow row between"><a href="/" class="brand" style="text-decoration:none;color:inherit">Mehmaan<span>OS</span></a></div></header>
<main class="wrap narrow">
  <h1 style="margin-top:20px">Create your restaurant</h1>
  <p class="muted" id="trialNote">Free trial. No card needed.</p>
  <form class="card" id="f" novalidate>
    <label>Restaurant name<input id="name" required maxlength="80" autocomplete="organization"></label>
    <label style="display:block;margin-top:10px">Web address
      <div class="row" style="gap:4px"><span class="small muted" id="host" style="white-space:nowrap"></span><input id="slug" required maxlength="40" autocapitalize="off" spellcheck="false" style="flex:1"></div>
      <div class="small" id="slugMsg"></div></label>
    <label style="display:block;margin-top:10px">Country
      <select id="country"><option value="AE">United Arab Emirates (AED, 5% VAT included, Arabic)</option><option value="AF">Afghanistan (AFN, Dari, Pashto)</option><option value="custom">Other country (set currency and tax later)</option></select></label>
    <div class="grid cols2" style="margin-top:10px">
      <label>Your name<input id="owner" required maxlength="40" autocomplete="name"></label>
      <label>Email or phone<input id="contact" required maxlength="120" autocomplete="email"></label>
    </div>
    <div class="grid cols2" style="margin-top:10px">
      <label>Choose your manager PIN<input id="pin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="6–8 digits" required minlength="6"></label>
      <label>Repeat PIN<input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" required></label>
    </div>
    <label class="switch" style="margin-top:12px"><input type="checkbox" id="demo" checked><span>Start with a sample Afghan menu I can edit</span></label>
    <label id="codeRow" class="hidden" style="display:block;margin-top:10px">Invite code<input id="code" autocomplete="off"></label>
    <label class="switch" style="margin-top:12px;align-items:flex-start"><input type="checkbox" id="terms"><span class="small">I understand MehmaanOS is a pilot service. It does not process payments, and I am responsible for my menu prices, tax settings and allergen information.</span></label>
    <p id="msg" class="small" style="color:var(--bad)"></p>
    <button class="primary" style="width:100%" id="go">Create my restaurant</button>
  </form>
  <p class="small muted">Already have a restaurant? Open your own address, e.g. <code>/r/your-name/login</code>.</p>
</main>
<script src="/static/common.js"></script>
<script src="/static/signup.js"></script>
</body>
</html>
